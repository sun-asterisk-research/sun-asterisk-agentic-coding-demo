{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Đăng nhập - Personal Finance Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: #4CAF50;">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </h2>
                
                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control" 
                               id="id_username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" 
                               id="id_password" required>
                    </div>
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Tên đăng nhập hoặc mật khẩu không đúng.
                        </div>
                    {% endif %}
                    
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    Chưa có tài khoản? 
                    <a href="{% url 'register' %}" class="text-decoration-none fw-bold" style="color: #4CAF50;">
                        Đăng ký ngay
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
